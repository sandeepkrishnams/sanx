[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanx"
version = "0.0.0"
description = "Small webserver and CLI for sanx"
authors = [ { name = "You" } ]
readme = "README.md"
requires-python = ">=3.13"

dependencies = []

[project.scripts]
sanx = "sanx.cli:main"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\\.pyi?$'

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
exclude = ["__pycache__", ".git", "build", "dist", "venv"]

[tool.mypy]
python_version = "3.9"
files = ["sanx"]
ignore_missing_imports = true
warn_unused_configs = true
